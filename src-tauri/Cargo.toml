[package]
name = "kizuna-desktop"
version = "0.1.0"
description = "Kizuna Desktop: light novel reader"
authors = ["ohimeee"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kizuna_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = { version = "0.14.0", features = ["loader"] }
reqwest_cookie_store = "0.10.0"
scraper = "0.29.0"
md5 = "0.8.1"
anyhow = "1.0.105"
thiserror = "2.0.21"
url = "2.5.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "http2", "charset", "system-proxy", "cookies", "gzip", "brotli", "deflate", "zstd", "json", "query"] }
ego-tree = "0.11.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
